<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B0C0E" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#845314"/>
    </linearGradient>
    <linearGradient id="runeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- Fondo Dark Game Boy Advance SP -->
  <rect width="512" height="512" rx="110" fill="#0B0C0E"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="#14171C" stroke="#C5A059" stroke-width="8"/>
  <circle cx="256" cy="256" r="210" fill="url(#goldGlow)"/>

  <!-- Emblema de la Forja (Escudo Rúnico) -->
  <path d="M256 70 L390 140 V270 C390 360 320 420 256 450 C192 420 122 360 122 270 V140 Z" 
        fill="url(#shieldGrad)" stroke="#000000" stroke-width="12"/>

  <!-- Núcleo Interior / Pokebola de Élite -->
  <circle cx="256" cy="245" r="75" fill="#0B0C0E" stroke="#000000" stroke-width="10"/>
  <path d="M181 245 A75 75 0 0 1 331 245 Z" fill="#E60012"/>
  <path d="M181 245 A75 75 0 0 0 331 245 Z" fill="#F4F1EA"/>
  <line x1="181" y1="245" x2="331" y2="245" stroke="#000000" stroke-width="12"/>
  <circle cx="256" cy="245" r="26" fill="#FFFFFF" stroke="#000000" stroke-width="8"/>
  <circle cx="256" cy="245" r="12" fill="#C5A059"/>

  <!-- Runa / Rayo de Vigor y Templanza -->
  <path d="M256 345 L240 380 H265 L245 425 L285 375 H260 Z" fill="#22C55E" stroke="#000" stroke-width="4"/>
</svg>